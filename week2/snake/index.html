<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简易网页版贪吃蛇</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>简易贪吃蛇</h1>
    <div class="hud">
      <div>分数：<span id="score">0</span></div>
      <div>最高分：<span id="best">0</span></div>
      <div>速度：<span id="speed">1.0x</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls">
      <button id="start" type="button">开始/暂停 (Space)</button>
      <button id="restart" type="button">重新开始 (R)</button>
      <label class="speed-label">速度
        <input id="speedRange" type="range" min="5" max="20" value="10" />
      </label>
    </div>
    <p class="tips">
      操作：方向键或 W/A/S/D 控制方向，空格开始/暂停，R 重新开始。手机上可用滑动手势控制方向。
    </p>
  </div>
  <script src="./script.js"></script>
</body>
</html>
